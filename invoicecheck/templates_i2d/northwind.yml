  end: Subtotal
  line: ^\s*(?P<sku>[A-Z0-9][A-Z0-9-]+)\s+(?P<name>.+?)\s+(?P<quantity>\d+)\s+(?P<price_unit>[\d,]+\.\d{2})\s+(?P<line_total>[\d,]+\.\d{2})\s*$
options:
