issuer: Northwind Paper Co
keywords:
  - Northwind Paper Co
fields:
  invoice_number: Invoice No:\s+(\S+)
  date: Invoice Date:\s+(\d{2}/\d{2}/\d{4})
  amount: Total AUD\s+([\d,]+\.\d{2})
  issued_raw: Invoice Date:\s+(\d{2}/\d{2}/\d{4})
  po_number: PO Number:[ ]+([^\n]+)
  subtotal_raw: Subtotal\s+([\d,]+\.\d{2})
  tax_raw: GST 10%\s+([\d,]+\.\d{2})
  total_raw: Total AUD\s+([\d,]+\.\d{2})
lines:
