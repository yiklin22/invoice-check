<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Invoice check{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Invoice check</a>
  <nav>
    <a href="/">Invoices</a>
    <a href="/orders">Purchase orders</a>
    <a href="/export/discrepancies.csv">Export discrepancies</a>
    <a href="/export/invoices.csv">Export invoices</a>
  </nav>
  <form method="post" action="/reviewer" class="who">
    <label for="who">Reviewer</label>
    <input id="who" name="name" value="{{ reviewer }}" maxlength="80" required>
    <input type="hidden" name="next" value="{{ request.url.path }}">
    <button>Set</button>
  </form>
</header>
<main>
{% if flash %}<p class="flash {{ flash_kind }}" role="status">{{ flash }}</p>{% endif %}
{% block main %}{% endblock %}
</main>
</body>
</html>
