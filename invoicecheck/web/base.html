<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Invoice check{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">Invoice check</a>
  {% if account %}
  <nav>
    <a href="/">Invoices</a>
    <a href="/orders">Purchase orders</a>
    <a href="/export/discrepancies.csv">Export discrepancies</a>
    <a href="/export/invoices.csv">Export invoices</a>
  </nav>
  <form method="post" action="/logout" class="who">
    <a href="/account">{{ account.name }}</a>
    <button>Log out</button>
  </form>
  {% else %}
  <nav><a href="/login">Log in</a> <a href="/signup">Create an account</a></nav>
  {% endif %}
</header>
<main>
{% if flash %}<p class="flash {{ flash_kind }}" role="status">{{ flash }}</p>{% endif %}
{% block main %}{% endblock %}
</main>
</body>
</html>
